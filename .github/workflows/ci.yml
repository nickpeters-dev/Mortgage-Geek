name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - name: Rent vs Own parity (JS sim vs Python reference)
        run: npm test
      - name: Production build (prerenders all public routes)
        run: npm run build
      - name: Prerender check (static HTML, metadata, sitemap sync)
        run: npm run check:prerender

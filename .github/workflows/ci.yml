name: CI

# Every push to any branch and every pull request. A branch with an open pull
# request runs once per event; the concurrency group cancels a superseded run
# on the same ref.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - name: Reference files are current (regenerate and compare)
        run: |
          python3 tests/reference/rent_vs_own_edge_cases.py > /dev/null
          git diff --exit-code tests/reference/rent_vs_own_edge_cases.json
      - name: Tests (calculator suite, Rent vs Own suite, Python parity)
        run: npm test
      - name: Production build (prerenders all public routes)
        run: npm run build
      - name: Prerender check (static HTML, metadata, sitemap sync)
        run: npm run check:prerender

  # End-to-end browser tests (Playwright). A separate job so it runs in parallel
  # with `verify`, and a red check says which layer broke. Tests the app built
  # from THIS commit (playwright.config.ts builds it and serves it the way Vercel
  # does), never the live site. See QA_STRATEGY.md.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers (Chromium, WebKit) and their system libraries
        run: npx playwright install --with-deps chromium webkit
      - name: Playwright suite (builds, serves, runs http + desktop + mobile projects)
        run: npx playwright test
      - name: Upload HTML report, traces, and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
